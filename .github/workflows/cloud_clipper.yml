name: Cloud Video Clipper & Autonomous Agent
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL to Clip'
        required: true
      layout_mode:
        description: 'Layout Mode - blur or crop'
        required: true
        default: 'blur'
jobs:
  clip-in-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install FFmpeg & Python Deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
          pip install -r requirements.txt
      - name: Render 9:16 Short on GitHub Cloud CPU
        env:
          TARGET_URL: ${{ github.event.inputs.youtube_url }}
          LAYOUT_MODE: ${{ github.event.inputs.layout_mode }}
        run: |
          python -c "import os, app; app.process_video_pipeline(os.environ['TARGET_URL'], 'cloud', 'GitHub Actions', os.environ.get('LAYOUT_MODE', 'blur'), True)"
      - name: Upload Finished MP4 Short
        uses: actions/upload-artifact@v4
        with:
          name: ClipPulse-Short-${{ github.run_id }}
          path: outputs/*.mp4
